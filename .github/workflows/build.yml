name: Build PC_Optimizer ZIP

on:
  push:
    branches: [ "main", "master", "fix/dotnet-run-compilation" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Codigo
      uses: actions/checkout@v4

    - name: Instalar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compilar Projeto (Formato Transparente sem Falso Positivo)
      run: dotnet publish PCOptimizer.csproj -c Release -r win-x64 --self-contained false -p:Version=15.0.${{ github.run_number }} -p:AssemblyVersion=15.0.${{ github.run_number }} -p:FileVersion=15.0.${{ github.run_number }} -p:InformationalVersion=15.0.${{ github.run_number }} -o ./publish

    - name: Criar Ficheiro ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./publish/PC_Optimizer.zip

    - name: Publicar Release no GitHub
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v15.0.${{ github.run_number }}
        name: "⚡ PC Optimizer PRO (Build #${{ github.run_number }})"
        body: "Versão limpa sem gatilhos de falso positivo do antivírus."
        files: ./publish/PC_Optimizer.zip