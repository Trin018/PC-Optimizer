name: Build PC_Optimizer ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Codigo
      uses: actions/checkout@v4

    - name: Instalar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compilar PC_Optimizer.exe (Single-File)
      run: dotnet publish PCOptimizer.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./publish

    - name: Criar Ficheiro ZIP de Distribuicao
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/PC_Optimizer.exe -DestinationPath ./publish/PC_Optimizer_v14.zip

    - name: Publicar Release no GitHub com ZIP e EXE
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v14.0.${{ github.run_number }}
        name: "⚡ PC Optimizer PRO v14.0 (Build #${{ github.run_number }})"
        body: "Versão completa empacotada em ZIP (evita bloqueios de download direto do Smart App Control)."
        files: |
          ./publish/PC_Optimizer_v14.zip
          ./publish/PC_Optimizer.exe